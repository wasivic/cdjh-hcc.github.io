<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批次圖片縮放與打包工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        /* 自訂滾動條 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8; 
        }
        /* 隱藏預設檔案上傳按鈕 */
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 text-gray-800">

    <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">
        
        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-6 text-white text-center">
            <h1 class="text-3xl font-bold mb-2">批次圖片縮放與打包工具</h1>
            <p class="text-blue-100">輕鬆匯入大量圖片，自訂尺寸後一鍵打包下載 ZIP</p>
        </div>

        <div class="p-6 md:p-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-1 space-y-6">
                
                <!-- 拖曳上傳區 -->
                <div id="dropzone" class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center cursor-pointer hover:bg-gray-50 transition-colors duration-200 group">
                    <div class="flex flex-col items-center justify-center space-y-3">
                        <svg class="w-12 h-12 text-gray-400 group-hover:text-blue-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        <p class="text-gray-600 font-medium">點擊或拖曳圖片至此</p>
                        <p class="text-xs text-gray-400">支援 JPG, PNG, WebP</p>
                    </div>
                    <input type="file" id="fileInput" multiple accept="image/*">
                </div>

                <!-- 縮放設定區 -->
                <div class="bg-gray-50 rounded-xl p-5 border border-gray-100 shadow-sm">
                    <h2 class="text-lg font-semibold mb-4 flex items-center">
                        <svg class="w-5 h-5 mr-2 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
                        自訂尺寸設定
                    </h2>
                    
                    <div class="flex items-center mb-3">
                        <input type="checkbox" id="keepAspect" checked class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500">
                        <label for="keepAspect" class="ml-2 text-sm font-medium text-gray-700">保持圖片比例 (不變形)</label>
                    </div>

                    <!-- 保持比例時的設定選項 -->
                    <div id="aspectModeOptions" class="flex gap-4 mb-4 ml-6 transition-all duration-300">
                        <label class="flex items-center text-sm text-gray-600 cursor-pointer hover:text-blue-600">
                            <input type="radio" name="aspectMode" value="width" checked class="w-4 h-4 mr-2 text-blue-600 border-gray-300 focus:ring-blue-500">
                            以寬度為基準
                        </label>
                        <label class="flex items-center text-sm text-gray-600 cursor-pointer hover:text-blue-600">
                            <input type="radio" name="aspectMode" value="height" class="w-4 h-4 mr-2 text-blue-600 border-gray-300 focus:ring-blue-500">
                            以高度為基準
                        </label>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">寬度 (px)</label>
                            <input type="number" id="targetWidth" value="800" min="1" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition disabled:bg-gray-100 disabled:text-gray-400 disabled:cursor-not-allowed disabled:border-gray-200">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">高度 (px)</label>
                            <input type="number" id="targetHeight" value="800" min="1" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition disabled:bg-gray-100 disabled:text-gray-400 disabled:cursor-not-allowed disabled:border-gray-200" disabled>
                        </div>
                    </div>

                    <button id="exportBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition-transform transform active:scale-95 flex justify-center items-center opacity-50 cursor-not-allowed" disabled>
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        開始處理並下載 ZIP
                    </button>
                </div>
            </div>

            <div class="lg:col-span-2 flex flex-col h-full">
                
                <div class="flex justify-between items-end mb-4 border-b border-gray-200 pb-2">
                    <div>
                        <h2 class="text-xl font-bold text-gray-800">已匯入圖片</h2>
                        <p class="text-sm text-gray-500 mt-1" id="fileCountStatus">目前共有 0 張圖片準備處理</p>
                    </div>
                    <div class="flex gap-4">
                        <button id="reimportBtn" class="text-sm text-blue-600 hover:text-blue-800 font-medium transition hidden flex items-center">
                            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                            繼續/重新匯入
                        </button>
                        <button id="clearAllBtn" class="text-sm text-red-500 hover:text-red-700 font-medium transition hidden flex items-center">
                            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            清空全部
                        </button>
                    </div>
                </div>

                <!-- 預覽網格 -->
                <div id="previewGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 overflow-y-auto max-h-[500px] p-2 content-start flex-grow">
                    <!-- 預設空狀態 -->
                    <div id="emptyState" class="col-span-full flex flex-col items-center justify-center py-12 text-gray-400">
                        <svg class="w-16 h-16 mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        <p>尚未匯入任何圖片</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 進度覆蓋層 -->
    <div id="loadingOverlay" class="fixed inset-0 bg-gray-900 bg-opacity-75 z-50 hidden flex-col items-center justify-center backdrop-blur-sm transition-opacity">
        <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-sm w-full text-center">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-gray-200 border-t-blue-600 mb-4"></div>
            <h3 class="text-xl font-bold text-gray-800 mb-2">處理中，請稍候...</h3>
            <p id="progressText" class="text-gray-600 mb-4">正在處理第 0 / 0 張</p>
            
            <!-- 進度條 -->
            <div class="w-full bg-gray-200 rounded-full h-2.5 mb-2 overflow-hidden">
                <div id="progressBar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
            <p class="text-xs text-gray-500">處理完成後將自動下載</p>
        </div>
    </div>

    <!-- 訊息提示 (Toast) -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>

    <script>
        // 狀態管理
        let uploadedFiles = [];
        let objectUrls = []; // 儲存預覽圖片的 URL 以便釋放記憶體

        // DOM 元素取得
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const previewGrid = document.getElementById('previewGrid');
        const emptyState = document.getElementById('emptyState');
        const fileCountStatus = document.getElementById('fileCountStatus');
        const exportBtn = document.getElementById('exportBtn');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const reimportBtn = document.getElementById('reimportBtn');
        
        const targetWidthInput = document.getElementById('targetWidth');
        const targetHeightInput = document.getElementById('targetHeight');
        const keepAspectCheckbox = document.getElementById('keepAspect');
        const aspectModeOptions = document.getElementById('aspectModeOptions');
        const aspectRadios = document.getElementsByName('aspectMode');
        
        const loadingOverlay = document.getElementById('loadingOverlay');
        const progressText = document.getElementById('progressText');
        const progressBar = document.getElementById('progressBar');

        function updateSizeInputsState() {
            const isKeepAspect = keepAspectCheckbox.checked;
            let activeMode = 'width'; 
            
            for(const radio of aspectRadios) {
                if(radio.checked) activeMode = radio.value;
            }

            if (isKeepAspect) {
                aspectModeOptions.style.display = 'flex';
                if (activeMode === 'width') {
                    targetWidthInput.disabled = false;
                    targetHeightInput.disabled = true;
                } else {
                    targetWidthInput.disabled = true;
                    targetHeightInput.disabled = false;
                }
            } else {
                aspectModeOptions.style.display = 'none';
                targetWidthInput.disabled = false;
                targetHeightInput.disabled = false;
            }
        }

        keepAspectCheckbox.addEventListener('change', updateSizeInputsState);
        aspectRadios.forEach(radio => radio.addEventListener('change', updateSizeInputsState));
        // 初始化狀態
        updateSizeInputsState();


        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            
            // 根據類型設定顏色
            let bgColor = 'bg-gray-800';
            if(type === 'success') bgColor = 'bg-green-600';
            if(type === 'error') bgColor = 'bg-red-600';
            if(type === 'warning') bgColor = 'bg-yellow-500';

            toast.className = `${bgColor} text-white px-6 py-3 rounded-lg shadow-lg transform transition-all duration-300 translate-y-10 opacity-0 flex items-center`;
            
            toast.innerHTML = `
                <span class="mr-2">
                    ${type === 'success' ? '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>' : ''}
                    ${type === 'error' ? '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>' : ''}
                </span>
                ${message}
            `;

            document.getElementById('toastContainer').appendChild(toast);

            // 動畫進入
            setTimeout(() => {
                toast.classList.remove('translate-y-10', 'opacity-0');
            }, 10);

            // 自動移除
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => {
                    toast.remove();
                }, 300);
            }, 3000);
        }

        // 點擊上傳
        dropzone.addEventListener('click', () => fileInput.click());

        // 拖曳視覺效果
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropzone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropzone.addEventListener(eventName, () => {
                dropzone.classList.add('border-blue-500', 'bg-blue-50');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropzone.addEventListener(eventName, () => {
                dropzone.classList.remove('border-blue-500', 'bg-blue-50');
            }, false);
        });

        // 處理放置或選擇的檔案
        dropzone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles(files);
        });

        fileInput.addEventListener('change', function() {
            handleFiles(this.files);
            this.value = ''; // 重置，允許重複選擇相同檔案
        });

        // 過濾並加入檔案
        function handleFiles(files) {
            let addedCount = 0;
            const newFiles = Array.from(files).filter(file => {
                if (file.type.startsWith('image/')) {
                    uploadedFiles.push({
                        id: Math.random().toString(36).substr(2, 9),
                        file: file
                    });
                    addedCount++;
                    return true;
                }
                return false;
            });

            if (addedCount > 0) {
                showToast(`成功匯入 ${addedCount} 張圖片`, 'success');
                updateUI();
            } else if (files.length > 0) {
                showToast('請選擇有效的圖片檔案', 'error');
            }
        }

        function updateUI() {
            // 更新狀態文字
            const count = uploadedFiles.length;
            
            // 重要提醒：顯示當前圖片數量
            fileCountStatus.innerHTML = count > 0 
                ? `目前共有 <span class="font-bold text-blue-600 text-lg">${count}</span> 張圖片準備處理` 
                : '目前共有 0 張圖片準備處理';

            // 切換按鈕狀態
            if (count > 0) {
                exportBtn.disabled = false;
                exportBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                clearAllBtn.classList.remove('hidden');
                reimportBtn.classList.remove('hidden');
                emptyState.style.display = 'none';
            } else {
                exportBtn.disabled = true;
                exportBtn.classList.add('opacity-50', 'cursor-not-allowed');
                clearAllBtn.classList.add('hidden');
                reimportBtn.classList.add('hidden');
                emptyState.style.display = 'flex';
            }

            renderPreview();
        }

        function renderPreview() {
            // 清理舊的 ObjectURLs 避免記憶體洩漏
            objectUrls.forEach(url => URL.revokeObjectURL(url));
            objectUrls = [];

            // 移除除了 emptyState 以外的所有預覽卡片
            Array.from(previewGrid.children).forEach(child => {
                if (child.id !== 'emptyState') child.remove();
            });

            // 渲染新的預覽卡片
            uploadedFiles.forEach((item, index) => {
                const url = URL.createObjectURL(item.file);
                objectUrls.push(url);

                const card = document.createElement('div');
                card.className = 'relative group bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden aspect-square';
                
                card.innerHTML = `
                    <img src="${url}" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105" alt="Preview">
                    <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-40 transition-opacity duration-200 flex items-center justify-center opacity-0 group-hover:opacity-100">
                        <button onclick="removeFile('${item.id}')" class="bg-red-500 hover:bg-red-600 text-white p-2 rounded-full transform transition hover:scale-110 shadow-lg" title="移除圖片">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </div>
                    <div class="absolute bottom-0 left-0 right-0 bg-black bg-opacity-50 text-white text-xs truncate px-2 py-1">
                        ${item.file.name}
                    </div>
                `;
                previewGrid.appendChild(card);
            });
        }

        // 移除單一檔案
        window.removeFile = function(id) {
            uploadedFiles = uploadedFiles.filter(item => item.id !== id);
            updateUI();
        };

        // 清空全部
        clearAllBtn.addEventListener('click', () => {
            uploadedFiles = [];
            updateUI();
            showToast('已清空所有圖片', 'info');
        });

        // 重新匯入
        reimportBtn.addEventListener('click', () => {
            fileInput.click();
        });

        
        // 核心圖片縮放函式 (回傳 Promise)
        function resizeImage(file, targetW, targetH, keepAspect, aspectMode = 'width') {
            return new Promise((resolve, reject) => {
                const img = new Image();
                const url = URL.createObjectURL(file);
                
                img.onload = () => {
                    URL.revokeObjectURL(url); // 釋放記憶體
                    
                    let newW = targetW;
                    let newH = targetH;
                    
                    if (keepAspect) {
                        // 保持比例：依據選擇的基準計算另一個維度
                        if (aspectMode === 'width') {
                            newW = targetW;
                            newH = Math.round(img.height * (targetW / img.width));
                        } else {
                            newH = targetH;
                            newW = Math.round(img.width * (targetH / img.height));
                        }
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = newW;
                    canvas.height = newH;
                    
                    const ctx = canvas.getContext('2d');
                    
                    // 確保透明背景的圖片(如PNG)縮放後不會變黑，設定透明背景
                    ctx.clearRect(0, 0, newW, newH);
                    
                    // 使用雙線性插值平滑縮放 (瀏覽器預設)
                    ctx.drawImage(img, 0, 0, newW, newH);
                    
                    // 轉為 Blob，保持原始檔案類型
                    canvas.toBlob((blob) => {
                        if (blob) {
                            resolve(blob);
                        } else {
                            reject(new Error('Canvas轉檔失敗'));
                        }
                    }, file.type, 0.95); // 如果是jpeg，品質設為0.95
                };
                
                img.onerror = () => {
                    URL.revokeObjectURL(url);
                    reject(new Error('圖片載入失敗'));
                };
                
                img.src = url;
            });
        }

        // 執行打包流程
        exportBtn.addEventListener('click', async () => {
            if (uploadedFiles.length === 0) return;

            const tWidth = parseInt(targetWidthInput.value);
            const tHeight = parseInt(targetHeightInput.value);
            const keepAspect = keepAspectCheckbox.checked;

            let aspectMode = 'width';
            for(const radio of aspectRadios) {
                if(radio.checked) aspectMode = radio.value;
            }

            if (!keepAspect) {
                if (isNaN(tWidth) || tWidth <= 0 || isNaN(tHeight) || tHeight <= 0) {
                    showToast('請輸入有效的寬度與高度數值', 'error');
                    return;
                }
            } else {
                if (aspectMode === 'width' && (isNaN(tWidth) || tWidth <= 0)) {
                    showToast('請輸入有效的寬度數值', 'error');
                    return;
                }
                if (aspectMode === 'height' && (isNaN(tHeight) || tHeight <= 0)) {
                    showToast('請輸入有效的高度數值', 'error');
                    return;
                }
            }

            // 顯示載入畫面
            loadingOverlay.classList.remove('hidden');
            loadingOverlay.classList.add('flex');
            
            try {
                const zip = new JSZip();
                const total = uploadedFiles.length;

                for (let i = 0; i < total; i++) {
                    const item = uploadedFiles[i];
                    
                    // 更新進度介面
                    progressText.innerText = `正在處理第 ${i + 1} / ${total} 張\n(${item.file.name})`;
                    progressBar.style.width = `${((i) / total) * 100}%`;
                    
                    // 讓瀏覽器有時間渲染進度條 (防止UI凍結)
                    await new Promise(r => setTimeout(r, 50)); 

                    try {
                        const resizedBlob = await resizeImage(item.file, tWidth, tHeight, keepAspect, aspectMode);
                        // 將處理後的檔案加入 zip (確保副檔名正確，若無則依賴原始名稱)
                        zip.file(item.file.name, resizedBlob);
                    } catch (err) {
                        console.error(`處理圖片 ${item.file.name} 失敗:`, err);
                        // 失敗也繼續處理下一張
                    }
                }

                // 準備打包 ZIP
                progressText.innerText = '正在生成 ZIP 壓縮檔...';
                progressBar.style.width = '95%';

                const zipBlob = await zip.generateAsync({ 
                    type: 'blob',
                    compression: "DEFLATE",
                    compressionOptions: {
                        level: 5 // 適度的壓縮率與速度平衡
                    }
                });

                progressBar.style.width = '100%';
                
                // 觸發下載
                const downloadUrl = URL.createObjectURL(zipBlob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                // 設定匯出的檔名包含時間戳記
                const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
                a.download = `Resized_Images_${timestamp}.zip`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(downloadUrl);

                showToast('處理完成！已開始下載', 'success');

            } catch (error) {
                console.error(error);
                showToast('處理過程中發生錯誤', 'error');
            } finally {
                // 隱藏載入畫面
                setTimeout(() => {
                    loadingOverlay.classList.add('hidden');
                    loadingOverlay.classList.remove('flex');
                    progressBar.style.width = '0%';
                }, 1000);
            }
        });
    </script>
</body>
</html>
